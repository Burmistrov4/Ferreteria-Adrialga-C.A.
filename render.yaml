services:
  - type: web
    name: adrialga-ferreteria-pos
    env: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adrialga-postgres-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: DEBUG
        value: "False"
      - key: RENDER_EXTERNAL_URL
        fromRoute: true

databases:
  - name: adrialga-postgres-db
    plan: free
    databaseName: adrialga
    user: adrialga_user
